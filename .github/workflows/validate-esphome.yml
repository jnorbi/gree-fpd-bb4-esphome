name: Validate ESPHome

on:
  push:
    branches:
      - main
      - public-yaml-v1
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - esphome/gree-fpd-bb4-cooling-only.yaml
          - esphome/gree-fpd-bb4-heating-enabled.yaml

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ESPHome
        run: python -m pip install "esphome==2026.9.1"

      - name: Create test secrets
        run: cp esphome/secrets.example.yaml esphome/secrets.yaml

      - name: Validate configuration
        run: esphome config "${{ matrix.config }}"

      - name: Compile configuration
        run: esphome compile "${{ matrix.config }}"
