# READ-ONLY MODBUS DISCOVERY HELPER
#
# Reconstructed from the discovery workflow used for the Gree FPD-BB4 project.
# It is intentionally read-only: no Modbus write actions are defined.
#
# Hardware: Seeed XIAO ESP32-C3 + Seeed Studio XIAO RS485 breakout board
# Bus: 9600 baud, 8 data bits, no parity, 1 stop bit
# Tested slave address: 1
#
# Use the ESPHome web UI to choose a slave address, start address and count,
# then press one of the four read buttons. Results are written to the ESPHome log.

substitutions:
  device_name: "gree-fpd-bb4-discovery"
  friendly_name: "Gree FPD-BB4 Modbus Discovery"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: arduino

logger:
  level: VERY_VERBOSE
  baud_rate: 0
  logs:
    modbus: VERY_VERBOSE
    modbus_client: VERY_VERBOSE

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:
  - platform: web_server

web_server:
  port: 80
  version: 3
  auth:
    username: !secret web_username
    password: !secret web_password
    type: digest

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Gree-Modbus-Discovery-Fallback"
    password: !secret fallback_ap_password

captive_portal:

uart:
  id: rs485_uart
  tx_pin: GPIO6
  rx_pin: GPIO7
  flow_control_pin: GPIO4
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

modbus:
  id: gree_modbus
  uart_id: rs485_uart
  send_wait_time: 250ms
  turnaround_time: 200ms

number:
  - platform: template
    id: discovery_slave_address
    name: "Slave Address"
    min_value: 1
    max_value: 247
    step: 1
    initial_value: 1
    restore_value: true
    optimistic: true
    entity_category: diagnostic

  - platform: template
    id: discovery_start_address
    name: "Start Address"
    min_value: 0
    max_value: 65535
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: diagnostic

  - platform: template
    id: discovery_register_count
    name: "Register Count"
    min_value: 1
    max_value: 125
    step: 1
    initial_value: 1
    restore_value: true
    optimistic: true
    entity_category: diagnostic

  - platform: template
    id: discovery_bit_count
    name: "Bit Count"
    min_value: 1
    max_value: 2000
    step: 1
    initial_value: 1
    restore_value: true
    optimistic: true
    entity_category: diagnostic

button:
  - platform: template
    name: "Read Holding Registers (FC03)"
    icon: "mdi:numeric"
    on_press:
      - modbus_client.read_holding_registers:
          modbus_id: gree_modbus
          address: !lambda 'return static_cast<uint8_t>(id(discovery_slave_address).state);'
          start_address: !lambda 'return static_cast<uint16_t>(id(discovery_start_address).state);'
          count: !lambda 'return static_cast<uint16_t>(id(discovery_register_count).state);'
          on_response:
            then:
              - lambda: |-
                  const uint16_t start = static_cast<uint16_t>(id(discovery_start_address).state);
                  ESP_LOGI("modbus_discovery", "Holding register response: start=%u count=%u", start, values.size());
                  for (size_t i = 0; i < values.size(); i++) {
                    ESP_LOGI("modbus_discovery", "H%u = %u (0x%04X)",
                             start + i, values[i], values[i]);
                  }
          on_error:
            then:
              - lambda: |-
                  ESP_LOGW("modbus_discovery", "FC03 exception: 0x%02X",
                           static_cast<uint8_t>(exception_code));

  - platform: template
    name: "Read Input Registers (FC04)"
    icon: "mdi:numeric"
    on_press:
      - modbus_client.read_input_registers:
          modbus_id: gree_modbus
          address: !lambda 'return static_cast<uint8_t>(id(discovery_slave_address).state);'
          start_address: !lambda 'return static_cast<uint16_t>(id(discovery_start_address).state);'
          count: !lambda 'return static_cast<uint16_t>(id(discovery_register_count).state);'
          on_response:
            then:
              - lambda: |-
                  const uint16_t start = static_cast<uint16_t>(id(discovery_start_address).state);
                  ESP_LOGI("modbus_discovery", "Input register response: start=%u count=%u", start, values.size());
                  for (size_t i = 0; i < values.size(); i++) {
                    ESP_LOGI("modbus_discovery", "I%u = %u (0x%04X)",
                             start + i, values[i], values[i]);
                  }
          on_error:
            then:
              - lambda: |-
                  ESP_LOGW("modbus_discovery", "FC04 exception: 0x%02X",
                           static_cast<uint8_t>(exception_code));

  - platform: template
    name: "Read Coils (FC01)"
    icon: "mdi:toggle-switch"
    on_press:
      - modbus_client.read_coils:
          modbus_id: gree_modbus
          address: !lambda 'return static_cast<uint8_t>(id(discovery_slave_address).state);'
          start_address: !lambda 'return static_cast<uint16_t>(id(discovery_start_address).state);'
          count: !lambda 'return static_cast<uint16_t>(id(discovery_bit_count).state);'
          on_response:
            then:
              - lambda: |-
                  const uint16_t start = static_cast<uint16_t>(id(discovery_start_address).state);
                  ESP_LOGI("modbus_discovery", "Coil response: start=%u count=%u", start, bits.size());
                  for (size_t i = 0; i < bits.size(); i++) {
                    ESP_LOGI("modbus_discovery", "C%u = %u",
                             start + i, static_cast<unsigned>(bits[i]));
                  }
          on_error:
            then:
              - lambda: |-
                  ESP_LOGW("modbus_discovery", "FC01 exception: 0x%02X",
                           static_cast<uint8_t>(exception_code));

  - platform: template
    name: "Read Discrete Inputs (FC02)"
    icon: "mdi:checkbox-marked-circle-outline"
    on_press:
      - modbus_client.read_discrete_inputs:
          modbus_id: gree_modbus
          address: !lambda 'return static_cast<uint8_t>(id(discovery_slave_address).state);'
          start_address: !lambda 'return static_cast<uint16_t>(id(discovery_start_address).state);'
          count: !lambda 'return static_cast<uint16_t>(id(discovery_bit_count).state);'
          on_response:
            then:
              - lambda: |-
                  const uint16_t start = static_cast<uint16_t>(id(discovery_start_address).state);
                  ESP_LOGI("modbus_discovery", "Discrete input response: start=%u count=%u", start, bits.size());
                  for (size_t i = 0; i < bits.size(); i++) {
                    ESP_LOGI("modbus_discovery", "D%u = %u",
                             start + i, static_cast<unsigned>(bits[i]));
                  }
          on_error:
            then:
              - lambda: |-
                  ESP_LOGW("modbus_discovery", "FC02 exception: 0x%02X",
                           static_cast<uint8_t>(exception_code));
