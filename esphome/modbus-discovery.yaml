  - platform: template
    name: "READ HOLDING - Function 03"
    icon: mdi:numeric-3-box
    on_press:
      - if:
          condition:
            lambda: |-
              return !id(scan_active);
          then:
            - lambda: |-
                id(manual_result).publish_state("-");
                id(manual_status).publish_state("READ HOLDING...");
            - modbus_client.read_holding_registers:
                modbus_id: gree_modbus
                address: 1
                start_address: !lambda "return (uint16_t) id(manual_start).state;"
                count: !lambda "return (uint16_t) id(manual_count).state;"
                on_response:
                  then:
                    - lambda: |-
                        const uint16_t start = (uint16_t) id(manual_start).state;
                        std::string out;
                        for (size_t i = 0; i < values.size(); i++) {
                          char buf[56];
                          snprintf(buf, sizeof(buf), "H%u=%u(0x%04X)",
                                   start + (uint16_t) i, values[i], values[i]);
                          if (!out.empty()) out += " | ";
                          out += buf;
                        }
                        id(manual_result).publish_state(out);
                        id(manual_status).publish_state("OK");
                on_custom_response:
                  then:
                    - lambda: |-
                        char buf[64];
                        snprintf(buf, sizeof(buf), "CUSTOM response (%u bytes)", (unsigned) response.size());
                        id(manual_status).publish_state(buf);
                on_error:
                  then:
                    - lambda: |-
                        char buf[96];
                        snprintf(buf, sizeof(buf), "EXCEPTION 0x%02X", (uint8_t) exception_code);
                        id(manual_status).publish_state(buf);
                on_no_response:
                  then:
                    - lambda: |-
                        id(manual_status).publish_state("TIMEOUT / NO RESPONSE");
                on_not_sent:
                  then:
                    - lambda: |-
