# Copy this file to secrets.yaml in your ESPHome configuration directory,
# then replace the placeholder values with your own credentials.

wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# 32-byte base64 ESPHome API encryption key.
# Generate your own key in ESPHome.
api_encryption_key: "YOUR_ESP_HOME_API_ENCRYPTION_KEY"

web_username: "admin"
web_password: "YOUR_STRONG_WEB_PASSWORD"

# Must be at least 8 characters; used by the fallback access point.
fallback_ap_password: "YOUR_STRONG_FALLBACK_AP_PASSWORD"
